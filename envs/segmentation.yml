name: robonexus-sam

channels:
  - defaults

dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - numpy==2.2.6
      - opencv-python==5.0.0.93
      - pycocotools==2.0.11
      - matplotlib==3.10.9
      # Required by launch-ros visible on the development host.
      - pyyaml==6.0.3
