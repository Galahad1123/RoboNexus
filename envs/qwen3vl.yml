name: robonexus-qwen

channels:
  - defaults

dependencies:
  - python=3.11
  - pip
  - pip:
      # CUDA 12.8 is compatible with the tested RTX 3090 host driver.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - torchaudio==2.11.0+cu128
      - transformers==5.14.1
      - accelerate==1.14.0
      - safetensors==0.8.0
      - sentencepiece==0.2.2
      - qwen-vl-utils==0.0.14
      - qwen-agent[python_executor]==0.0.34
      - modelscope==1.38.1
      - pillow==12.2.0
      - opencv-python==5.0.0.93
      - websockets==16.1.1
      - msgpack==1.2.1
      - pydantic==2.13.4
      - soundfile==0.14.0
      - regex==2026.7.19
      - tqdm==4.70.0
