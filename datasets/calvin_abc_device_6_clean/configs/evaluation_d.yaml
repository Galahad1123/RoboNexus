version: 1
name: calvin_abc_device_6_clean_d
manifest: datasets/calvin_abc_device_6_clean/manifests/segments.json
source_dataset: calvin/dataset/task_ABC_D
split: d_validation
oracle_config: calvin/calvin_models/conf/callbacks/rollout/tasks/new_playtable_tasks.yaml

# Clean-RGB ABC-trained policy evaluated on the official D validation split.
defaults: {max_steps: 150, settle_steps: 0}

tasks:
  - {task: move_slider_left, oracle_task: move_slider_left, instruction: "move the sliding door to the left"}
  - {task: move_slider_right, oracle_task: move_slider_right, instruction: "move the sliding door to the right"}
  - {task: turn_off_led, oracle_task: turn_off_led, instruction: "press the button to turn off the led"}
  - {task: turn_off_lightbulb, oracle_task: turn_off_lightbulb, instruction: "move the switch to turn off the lightbulb"}
  - {task: turn_on_led, oracle_task: turn_on_led, instruction: "press the button to turn on the led"}
  - {task: turn_on_lightbulb, oracle_task: turn_on_lightbulb, instruction: "move the switch to turn on the lightbulb"}
