version: 1
name: calvin_abc_manipulation_13_clean_d
manifest: datasets/calvin_abc_manipulation_13_clean/manifests/segments.json
source_dataset: calvin/dataset/task_ABC_D
split: d_validation
oracle_config: calvin/calvin_models/conf/callbacks/rollout/tasks/new_playtable_tasks.yaml

# Clean-RGB policy: do not configure or request a mask provider at evaluation.
defaults:
  max_steps: 150
  settle_steps: 0

tasks:
  - {task: push_blue_block_left, oracle_task: push_blue_block_left, instruction: "push the blue block to the left", max_steps: 120}
  - {task: push_blue_block_right, oracle_task: push_blue_block_right, instruction: "push the blue block to the right", max_steps: 120}
  - {task: push_pink_block_left, oracle_task: push_pink_block_left, instruction: "push the pink block to the left", max_steps: 120}
  - {task: push_pink_block_right, oracle_task: push_pink_block_right, instruction: "push the pink block to the right", max_steps: 120}
  - {task: push_red_block_left, oracle_task: push_red_block_left, instruction: "push the red block to the left", max_steps: 120}
  - {task: push_red_block_right, oracle_task: push_red_block_right, instruction: "push the red block to the right", max_steps: 120}

  - task: rotate_blue_block_left
    oracle_task: rotate_blue_block_left
    instruction: "rotate the blue block counterclockwise"
    success_guard: &released {gripper: open, min_width_m: 0.04, consecutive_steps: 3}
  - {task: rotate_blue_block_right, oracle_task: rotate_blue_block_right, instruction: "rotate the blue block clockwise", success_guard: *released}
  - {task: rotate_pink_block_left, oracle_task: rotate_pink_block_left, instruction: "rotate the pink block counterclockwise", success_guard: *released}
  - {task: rotate_pink_block_right, oracle_task: rotate_pink_block_right, instruction: "rotate the pink block clockwise", success_guard: *released}
  - {task: rotate_red_block_left, oracle_task: rotate_red_block_left, instruction: "rotate the red block counterclockwise", success_guard: *released}
  - {task: rotate_red_block_right, oracle_task: rotate_red_block_right, instruction: "rotate the red block clockwise", success_guard: *released}

  - task: stack_block
    oracle_task: stack_block
    instruction: "stack one block on top of another block"
    success_guard: *released
