version: 1
name: calvin_abc_general_21_clean_task_D_D
manifest: datasets/calvin_abc_general_21_clean/manifests/task_D_D_validation.json
source_dataset: calvin/dataset/task_D_D
split: validation
oracle_config: calvin/calvin_models/conf/callbacks/rollout/tasks/new_playtable_tasks.yaml
defaults: {max_steps: 150, settle_steps: 0}
tasks:
  - {task: close_drawer, oracle_task: close_drawer}
  - {task: lift_blue_block_drawer, oracle_task: lift_blue_block_drawer}
  - {task: lift_blue_block_slider, oracle_task: lift_blue_block_slider}
  - {task: lift_blue_block_table, oracle_task: lift_blue_block_table}
  - {task: lift_pink_block_drawer, oracle_task: lift_pink_block_drawer}
  - {task: lift_pink_block_slider, oracle_task: lift_pink_block_slider}
  - {task: lift_pink_block_table, oracle_task: lift_pink_block_table}
  - {task: lift_red_block_drawer, oracle_task: lift_red_block_drawer}
  - {task: lift_red_block_slider, oracle_task: lift_red_block_slider}
  - {task: lift_red_block_table, oracle_task: lift_red_block_table}
  - {task: move_slider_left, oracle_task: move_slider_left}
  - {task: move_slider_right, oracle_task: move_slider_right}
  - {task: open_drawer, oracle_task: open_drawer}
  - {task: place_in_drawer, oracle_task: place_in_drawer, success_guard: &released {gripper: open, min_width_m: 0.04, consecutive_steps: 3}}
  - {task: place_in_slider, oracle_task: place_in_slider, success_guard: *released}
  - {task: push_into_drawer, oracle_task: push_into_drawer}
  - {task: turn_off_led, oracle_task: turn_off_led}
  - {task: turn_off_lightbulb, oracle_task: turn_off_lightbulb}
  - {task: turn_on_led, oracle_task: turn_on_led}
  - {task: turn_on_lightbulb, oracle_task: turn_on_lightbulb}
  - {task: unstack_block, oracle_task: unstack_block}
