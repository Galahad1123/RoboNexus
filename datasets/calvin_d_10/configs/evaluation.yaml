version: 1
name: calvin_d_10
manifest: datasets/calvin_d_10/manifests/segments.json
source_dataset: calvin/dataset/task_D_D
split: validation
oracle_config: calvin/calvin_models/conf/callbacks/rollout/tasks/new_playtable_tasks.yaml

defaults:
  max_steps: 120
  settle_steps: 0

tasks:
  - task: lift_red_block_table
    instruction: lift the red block from the table
    oracle_task: lift_red_block_table
    mask_roles:
      source: [{movable: block_red}]
    retry:
      enabled: true
      strategy: oracle_pre_approach
      target: {movable: block_red}
      xy_threshold_m: 0.10
      hover_height_m: 0.12
  - task: lift_blue_block_drawer
    instruction: lift the blue block from the drawer
    oracle_task: lift_blue_block_drawer
    mask_roles:
      source: [{movable: block_blue}]
    retry:
      enabled: true
      strategy: oracle_pre_approach
      target: {movable: block_blue}
      xy_threshold_m: 0.10
      hover_height_m: 0.12
  - task: push_red_block_left
    instruction: push the red block to the left
    oracle_task: push_red_block_left
    mask_roles:
      source: [{movable: block_red}]
    retry:
      enabled: true
      strategy: oracle_pre_approach
      target: {movable: block_red}
      xy_threshold_m: 0.10
      hover_height_m: 0.12
  - task: rotate_pink_block_right
    instruction: rotate the pink block clockwise
    oracle_task: rotate_pink_block_right
    mask_roles:
      source: [{movable: block_pink}]
    retry:
      enabled: true
      strategy: oracle_pre_approach
      target: {movable: block_pink}
      xy_threshold_m: 0.10
      hover_height_m: 0.12
  - task: open_drawer
    instruction: open the drawer
    oracle_task: open_drawer
    mask_roles:
      target: [{fixed: table, links: [drawer_link]}]
    retry:
      enabled: true
      strategy: oracle_pre_approach
      target: {fixed: table, links: [drawer_link]}
      xy_threshold_m: 0.10
      hover_height_m: 0.12
  - task: close_drawer
    instruction: close the drawer
    oracle_task: close_drawer
    mask_roles:
      target: [{fixed: table, links: [drawer_link]}]
    retry:
      enabled: true
      strategy: oracle_pre_approach
      target: {fixed: table, links: [drawer_link]}
      xy_threshold_m: 0.10
      hover_height_m: 0.12
  - task: move_slider_left
    instruction: move the sliding door to the left
    oracle_task: move_slider_left
    mask_roles:
      target: [{fixed: table, links: [slide_link]}]
    retry:
      enabled: true
      strategy: oracle_pre_approach
      target: {fixed: table, links: [slide_link]}
      xy_threshold_m: 0.10
      hover_height_m: 0.12
  - task: turn_on_led
    instruction: press the button to turn on the led
    oracle_task: turn_on_led
    mask_roles:
      target: [{fixed: table, links: [button_link]}]
    retry:
      enabled: true
      strategy: oracle_pre_approach
      target: {fixed: table, links: [button_link]}
      xy_threshold_m: 0.10
      hover_height_m: 0.12
  - task: place_in_drawer
    instruction: place the held block in the drawer
    oracle_task: place_in_drawer
    mask_roles:
      source: [{held_movable: true}]
      destination: [{fixed: table, links: [drawer_link]}]
    retry:
      enabled: false
      reason: requires_multi_skill_recovery
  - task: stack_block
    instruction: place the held block on top of another block
    oracle_task: stack_block
    mask_roles:
      source: [{held_movable: true}]
      destination: [{unheld_movable: true}]
    retry:
      enabled: false
      reason: requires_multi_skill_recovery
